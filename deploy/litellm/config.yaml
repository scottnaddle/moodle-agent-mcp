# LiteLLM 참조 설정 (guardrail 예시)
# 실제 배포본은 서버의 /opt/litellm-*/config.yaml 를 참조하고, 여기 파일은 리뷰용 참조다.
# 비밀값은 절대 기입 금지 — os.environ/ 참조만 사용한다.

model_list:
  - model_name: ubm-todo
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY

litellm_settings:
  turn_off_message_logging: true
  drop_params: true
  json_logs: true
  store_prompts_in_spend_logs: false
  disable_error_logs: true

general_settings:
  database_url: os.environ/DATABASE_URL

guardrails:
  - guardrail_name: presidio-pii
    litellm_params:
      guardrail: presidio
      mode: pre_call
      default_on: true
      # 입력만 검사한다. 출력은 hub 가명화 토큰 복원 흐름과 충돌하므로 다루지 않는다.
      presidio_filter_scope: input
      presidio_ad_hoc_recognizers: /app/ko_recognizers.json
      output_parse_pii: true
      # PERSON/LOCATION 등은 NER 엔티티이다. 사람 이름은 hub 가명화기(pseudonymizer)가
      # 가역적으로 처리하므로 Presidio에서 마스킹하면 안 된다. LOCATION, DATE_TIME 등의
      # NER 엔티티는 JSON 계획 문자열 안에서 <LOCATION> 같은 토큰으로 깨져 LLM이 깨진
      # 계획을 그대로 출력하게 만든다. 따라서 실제 PII만 allowlist로 MASK한다.
      pii_entities_config:
        EMAIL_ADDRESS: MASK
        PHONE_NUMBER: MASK
        CREDIT_CARD: MASK
        KR_RRN: MASK
        KR_STUDENT_ID: MASK
